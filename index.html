<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nana's 19th Birthday</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #f9c6d4);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #d86b8a;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .deadline {
      display: inline-block;
      background: #ffe8ef;
      color: #c65375;
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #f1c1cf;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #d86b8a;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #d86b8a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c95778;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
    }

    .sucesso {
      color: #4d9b68;
    }

    .erro {
      color: #c65375;
    }

    /* Formulário invisível usado para enviar ao Google Forms */
    #formularioGoogle {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Nana's 19th Birthday 🎀</h1>

    <p class="subtitle">
      Você está convidado para comemorar esse dia especial comigo! ♡
    </p>

    <div class="deadline">
      Confirme até o dia 29.09 (terça-feira)
    </div>

    <input
      type="text"
      id="nome"
      placeholder="Seu nome"
      autocomplete="name"
    >

    <button id="botao" onclick="confirmarPresenca()">
      Confirmar presença ♡
    </button>

    <div id="mensagem"></div>

  </div>


  <!--
    FORMULÁRIO INVISÍVEL DO GOOGLE FORMS
  -->

  <iframe
    name="iframeGoogle"
    style="display:none;">
  </iframe>

  <form
    id="formularioGoogle"
    action="https://docs.google.com/forms/d/e/1FAIpQLScyEmFp8XGM49KEAc1q34g62mygltP1nCMwIo1EvzWp_KAP-w/formResponse"
    method="POST"
    target="iframeGoogle">

    <input
      type="text"
      name="entry.592017861"
      id="nomeGoogle">

  </form>


  <script>

    function confirmarPresenca() {

      const nome = document.getElementById("nome").value.trim();
      const botao = document.getElementById("botao");
      const mensagem = document.getElementById("mensagem");
      const nomeGoogle = document.getElementById("nomeGoogle");
      const formularioGoogle = document.getElementById("formularioGoogle");

      /*
        Verifica se o nome foi preenchido
      */

      if (nome === "") {

        mensagem.className = "erro";
        mensagem.innerHTML = "Por favor, coloque seu nome. 💕";

        return;
      }


      /*
        Verifica a data limite
      */

      const agora = new Date();

      // 29/09/2026 às 23:59:59
      const limite = new Date("2026-09-29T23:59:59");

      if (agora > limite) {

        mensagem.className = "erro";
        mensagem.innerHTML =
          "As confirmações já foram encerradas. 💕";

        botao.disabled = true;

        return;
      }


      /*
        Coloca o nome no formulário do Google
      */

      nomeGoogle.value = nome;


      /*
        Evita dois cliques
      */

      botao.disabled = true;
      botao.innerText = "Enviando...";


      /*
        Envia para o Google Forms
      */

      formularioGoogle.submit();


      /*
        Aguarda o envio e mostra a mensagem
      */

      setTimeout(function() {

        mensagem.className = "sucesso";

        mensagem.innerHTML =
          "✨ Presença confirmada! 💕<br><br>" +
          "Obrigada, " + nome + "!";

        document.getElementById("nome").value = "";

        botao.innerText = "Presença confirmada ✓";

      }, 1000);

    }

  </script>

</body>
</html>
