<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nana's 19th Birthday</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fce8f0;

            font-family: Arial, sans-serif;

            color: #5f3b49;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px 35px;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(180, 100, 130, 0.15);

            text-align: center;
        }

        .heart {
            font-size: 38px;

            margin-bottom: 10px;

            color: #d77fa1;
        }

        h1 {
            color: #c76b91;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;

            color: #8a6875;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        .data {
            display: inline-block;

            background: #fff0f5;

            color: #b65f82;

            padding: 9px 15px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 30px;
        }

        label {
            display: block;

            text-align: left;

            margin-bottom: 8px;

            font-weight: bold;

            color: #704857;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 2px solid #f2c4d5;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            margin-bottom: 20px;
        }

        input:focus {
            border-color: #d77fa1;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: #d77fa1;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #c9688f;

            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;

            cursor: wait;

            transform: none;
        }

        #mensagem {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #fff0f5;

            border-radius: 15px;

            color: #8b4d66;

            font-weight: bold;

            line-height: 1.5;
        }

        .decoracao {
            margin-top: 25px;

            color: #d77fa1;

            font-size: 20px;
        }

        #formularioGoogle {
            display: none;
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="heart">♡</div>


        <h1>Nana's 19th Birthday</h1>


        <p class="subtitle">

            Você está convidado para comemorar
            esse dia especial comigo! ♡

        </p>


        <div class="data">

            Confirme até o dia 29.09 (terça-feira)

        </div>


        <form id="formulario">

            <label for="nome">
                Seu nome
            </label>


            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >


            <button type="submit" id="botao">

                Confirmar presença ♡

            </button>

        </form>


        <div id="mensagem"></div>


        <div class="decoracao">

            ✿ ♡ ✿

        </div>


    </div>


    <!--
        Formulário invisível que envia a resposta
        para o Google Forms.
    -->

    <iframe
        name="iframeGoogle"
        id="iframeGoogle"
        style="display:none;">
    </iframe>


    <form
        id="formularioGoogle"
        action="https://docs.google.com/forms/d/e/1FAIpQLScyEmFp8XGM49KEAc1q34g62mygltP1nCMwIo1EvzWp_KAP-w/formResponse"
        method="POST"
        target="iframeGoogle">

        <input
            type="text"
            name="entry.592017861"
            id="nomeGoogle"
        >

    </form>


    <script>


        // ==========================================
        // DATA LIMITE
        // ==========================================

        const dataLimite =
            new Date('2026-09-29T23:59:59');


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formulario =
            document.getElementById("formulario");


        const mensagem =
            document.getElementById("mensagem");


        const botao =
            document.getElementById("botao");


        const formularioGoogle =
            document.getElementById("formularioGoogle");


        const nomeGoogle =
            document.getElementById("nomeGoogle");


        // ==========================================
        // VERIFICAR PRAZO
        // ==========================================

        function verificarPrazo() {

            const agora = new Date();


            if (agora > dataLimite) {

                formulario.style.display = "none";


                mensagem.innerHTML = `
                    💗
                    <br><br>
                    As confirmações já foram encerradas.
                    <br><br>
                    Obrigada pelo carinho! ♡
                `;


                mensagem.style.display = "block";
            }

        }


        // Verifica assim que o site abre
        verificarPrazo();


        // ==========================================
        // CONFIRMAÇÃO
        // ==========================================

        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                // Verifica novamente a data
                const agora = new Date();


                if (agora > dataLimite) {

                    verificarPrazo();

                    return;
                }


                // Pega o nome
                const nome =
                    document
                    .getElementById("nome")
                    .value
                    .trim();


                if (!nome) {
                    return;
                }


                // Desativa o botão
                botao.disabled = true;

                botao.innerText =
                    "Confirmando...";


                // Coloca o nome no formulário do Google
                nomeGoogle.value = nome;


                // Envia para o Google Forms
                formularioGoogle.submit();


                // Mostra confirmação
                setTimeout(function() {

                    formulario.style.display =
                        "none";


                    mensagem.innerHTML = `

                        ✨ Presença confirmada! 💕

                        <br><br>

                        Obrigada, ${nome}!

                        <br><br>

                        Mal posso esperar para
                        comemorar com você! ♡

                    `;


                    mensagem.style.display =
                        "block";

                }, 700);

            }
        );


    </script>


</body>

</html>
